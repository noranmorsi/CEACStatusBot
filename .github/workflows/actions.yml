name: CEAC Hourly Check

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync environment
        run: uv sync

      - name: Run CEAC check
        env:
          LOCATION: ${{ secrets.LOCATION }}
          NUMBER: ${{ secrets.NUMBER }}
          PASSPORT_NUMBER: ${{ secrets.PASSPORT_NUMBER }}
          SURNAME: ${{ secrets.SURNAME }}
          TIMEZONE: Africa/Cairo

          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SMTP: ${{ secrets.SMTP }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          GH_TOKEN: ${{ secrets.GH_TOKEN }}

        run: uv run trigger.py

      - name: Commit updated status
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status_record.json

          git diff --cached --quiet || git commit -m "Update CEAC status record"

          git push
